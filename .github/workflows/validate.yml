name: Validate Portability

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill portability
        run: python scripts/validate_cross_runtime.py skills/

      - name: Run validator fixture tests
        run: python scripts/validate_cross_runtime.py --test-fixtures tests

      - name: Run installer smoke tests
        run: bash tests/test_installer.sh

      - name: Check for private/project-specific references
        run: |
          if grep -rnE 'prfastack|language_engine|dotfiles|pixi\.toml|new-app\.py|@prfastack' skills/; then
            echo "ERROR: Private/project-specific references found in skills/"
            exit 1
          fi

      - name: Check for private path patterns
        run: |
          if grep -rnE 'dotfiles/claude/skills|~/projects' skills/; then
            echo "ERROR: Private path patterns found in skills/"
            exit 1
          fi

  installer-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both the OS-default Windows PowerShell 5.1 (`powershell`)
        # and PowerShell 7+ (`pwsh`, preinstalled on the runner).
        shell: [powershell, pwsh]
    name: installer-windows (${{ matrix.shell }})
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          # TLS 1.2 is required for PSGallery on Windows PowerShell 5.1.
          [Net.ServicePointManager]::SecurityProtocol = `
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # 5.1 ships Pester 3.4; force a 5.x side-by-side install.
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Static analysis (PSScriptAnalyzer)
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer
          $findings = @()
          foreach ($f in 'install.ps1', 'tests/install.Tests.ps1') {
            $findings += Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($findings) {
            $findings | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap
            Write-Error "PSScriptAnalyzer reported $($findings.Count) finding(s)."
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: clean.'

      - name: Run Pester installer tests
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/install.Tests.ps1'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $res = Invoke-Pester -Configuration $cfg
          if ($res.FailedCount -gt 0) {
            Write-Error "$($res.FailedCount) Pester test(s) failed."
            exit 1
          }
